<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(0.92); opacity: 0.5; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    .animate-pulse-ring {
      animation: pulseRing 3s ease-in-out infinite;
    }
    .animate-float {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .delay-100 { animation-delay: 150ms; }
    .delay-200 { animation-delay: 300ms; }
    .delay-300 { animation-delay: 450ms; }

<div class="relative w-full max-w-md min-h-screen bg-gradient-to-b from-surface via-surface-container-low to-surface-container flex flex-col justify-between overflow-hidden shadow-2xl">
